name: CI/CD - Build & Deploy brone-auth

on:
  push:
    branches: [ "main", "master", "feat/update" ]
    paths:
      - 'brone-auth/**'
      - 'docker-compose.yaml'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        id: string
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./brone-auth
          file: ./brone-auth/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/brone-auth:latest
            ghcr.io/${{ env.REPO_LC }}/brone-auth:${{ github.sha }}

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 11023 }}
          script: |
            cd /home/dev/projects/docker/n8n-personal-assistant || cd ~/projects/docker/n8n-personal-assistant
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            docker compose pull brone-auth
            docker compose up -d brone-auth
